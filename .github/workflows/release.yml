name: One-Click Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0). Required for manual runs.'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-universal
          - os: windows-latest
            platform: windows-x86_64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config git curl \
            libgtk-3-dev libasound2-dev libwebkit2gtk-4.1-dev

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libasound2-dev
          ./download-pulp.sh
          wails build -platform linux/amd64 -m
          mkdir -p pkg/ddl8k-${{ steps.ver.outputs.version }}-linux-x86_64
          cp build/bin/ddl8k pkg/ddl8k-${{ steps.ver.outputs.version }}-linux-x86_64/
          cd pkg
          tar -czf ddl8k-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz ddl8k-${{ steps.ver.outputs.version }}-linux-x86_64

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          ./download-pulp.sh
          export MACOSX_DEPLOYMENT_TARGET=11.0
          wails build -platform darwin/universal -m
          mkdir -p pkg/ddl8k-${{ steps.ver.outputs.version }}-macos-universal
          cp -a build/bin/ddl8k.app pkg/ddl8k-${{ steps.ver.outputs.version }}-macos-universal/
          cd pkg
          zip -q -r ddl8k-${{ steps.ver.outputs.version }}-macos-universal.zip ddl8k-${{ steps.ver.outputs.version }}-macos-universal

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          bash ./download-pulp.sh
          wails build -platform windows/amd64 -m
          mkdir -p pkg/ddl8k-${{ steps.ver.outputs.version }}-windows-x86_64
          cp build/bin/ddl8k.exe pkg/ddl8k-${{ steps.ver.outputs.version }}-windows-x86_64/
          cd pkg
          zip -q -r ddl8k-${{ steps.ver.outputs.version }}-windows-x86_64.zip ddl8k-${{ steps.ver.outputs.version }}-windows-x86_64

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          cp pkg/*.tar.gz artifacts/ || true
          cp pkg/*.zip artifacts/ || true
          cd artifacts
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result != 'cancelled'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: release-*

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/*
          body: |
            Multi-platform **ddl8k** builds.

            | Platform | File |
            |----------|------|
            | Linux x86_64 | `ddl8k-*-linux-x86_64.tar.gz` |
            | macOS universal | `ddl8k-*-macos-universal.zip` |
            | Windows x86_64 | `ddl8k-*-windows-x86_64.zip` |

            SHA256 checksums attached.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
